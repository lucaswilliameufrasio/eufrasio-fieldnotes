[package]
name = "eufrasio-fieldnotes"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ammonia = "4"
serde = { version = "1", features = ["derive"] }
toasty = { version = "0.7", features = ["sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
topcoat = { version = "0.9", features = ["tailwind"] }
rusqlite = "0.39"
uuid = { version = "1.23", features = ["v7"] }

[build-dependencies]
topcoat = { version = "0.9", default-features = false, features = ["tailwind"] }
